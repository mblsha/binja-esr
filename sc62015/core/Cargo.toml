[package]
name = "sc62015-core"
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
description = "Pure-Rust SC62015 core scaffold (to be wrapped by PyO3)."

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = { version = "1.0", optional = true }
thiserror = "1.0"
zip = { version = "0.6", default-features = false, features = ["deflate"], optional = true }
retrobus-perfetto = { git = "https://github.com/mblsha/retrobus-perfetto.git", rev = "v0.3.1", optional = true }
crossterm = { version = "0.27", optional = true }
sha2 = { version = "0.10", optional = true }
crc32fast = "1.4"
flate2 = "1.0"
tiny-skia = { version = "0.12", default-features = false, features = ["std"] }
chrono = { version = "0.4", default-features = false, features = ["clock"], optional = true }

[target.'cfg(unix)'.dev-dependencies]
libc = "0.2"

[build-dependencies]
serde_json = "1.0"

[dev-dependencies]
serde_json = "1.0"

[dependencies.clap]
version = "4.5"
features = ["derive"]
optional = true

[features]
default = ["cli", "perfetto", "snapshot"]
json-compat = ["dep:serde_json"]
llama-tests = ["json-compat", "perfetto"]
cli = ["json-compat", "dep:chrono", "dep:clap", "dep:crossterm", "dep:sha2"]
perfetto = ["dep:retrobus-perfetto"]
snapshot = ["json-compat", "dep:zip"]

[[bin]]
name = "pce500"
path = "src/bin/pce500.rs"
required-features = ["cli"]

[[bin]]
name = "sc62015-lcd"
path = "src/bin/sc62015_lcd.rs"
required-features = ["cli"]

[[bin]]
name = "sc62015-bus-trace"
path = "src/bin/sc62015_bus_trace.rs"
required-features = ["cli"]

# The emulator is an interpreter whose hot path spans crate and module
# boundaries (CPU, bus, devices); whole-program optimization is measurably
# faster. See docs/rust_emulator_performance.md.
[profile.release]
lto = "fat"
codegen-units = 1
