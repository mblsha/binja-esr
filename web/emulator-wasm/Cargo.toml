[package]
name = "pce500-wasm"
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

# wasm-pack 0.13's --profiling alone still lets wasm-opt strip function names.
# Keep the normal optimizer level, preserving names only in profiling builds.
[package.metadata.wasm-pack.profile.profiling]
wasm-opt = ["-O", "-g"]

[dependencies]
base64 = "0.22"
js-sys = "0.3"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde-wasm-bindgen = "0.6"
wasm-bindgen = "0.2"

sc62015-core = { path = "../../sc62015/core", default-features = false, features = ["perfetto", "oz9600"] }

[dev-dependencies]
wasm-bindgen-test = "0.3"

# The emulator is an interpreter whose hot path spans crate and module
# boundaries (CPU, bus, devices); whole-program optimization is measurably
# faster. See docs/rust_emulator_performance.md.
[profile.release]
lto = "fat"
codegen-units = 1
