name: Rust Tests

on:
  push:
    branches: [ main, master, fast ]
  pull_request:
    branches: [ main, master, codex/oz9600-core ]

jobs:
  rust-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          enable-cache: true
          cache-dependency-glob: "pyproject.toml"

      - name: Install Python dependencies
        # The non-ignored Rust/Python parity subprocess smoke decodes the
        # generated Perfetto traces, so install the same trace tooling used by
        # the Python parity workflow.
        run: uv sync --extra dev --extra pce500

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cargo test (core)
        working-directory: sc62015/core
        env:
          FORCE_BINJA_MOCK: 1
        run: cargo test --all-targets --all-features

      - name: Check minimal core without optional device features
        working-directory: sc62015/core
        run: cargo check --locked --no-default-features --lib

      - name: Cargo test (rustcore)
        working-directory: sc62015/rustcore
        env:
          PYO3_PYTHON: ${{ github.workspace }}/.venv/bin/python
          PYTHONPATH: ${{ github.workspace }}:${{ github.workspace }}/.venv/lib/python3.11/site-packages
          FORCE_BINJA_MOCK: 1
        run: cargo test --all-targets --all-features

  native-window:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - name: Native window unit tests
        run: cargo test --locked --manifest-path sc62015/native-window/Cargo.toml
      - name: Native window lint and format
        run: |
          cargo clippy --locked --manifest-path sc62015/native-window/Cargo.toml --all-targets -- -D warnings
          cargo fmt --manifest-path sc62015/native-window/Cargo.toml --all -- --check
