name: Web (WASM)

on:
  push:
    branches: [ main, master, fast ]
  pull_request:
    branches: [ main, master, codex/oz9600-core ]

jobs:
  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20.19.0"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Install wasm-pack
        uses: jetli/wasm-pack-action@v0.4.0
        with:
          version: "v0.13.1"

      - name: Install dependencies
        run: npm ci

      - name: Build WASM once for frontend checks
        run: npm run wasm:build

      - name: Run Svelte checks
        run: npm run check:ci

      - name: Run frontend unit tests
        run: npm run test:ci

      - name: Run wasm-bindgen tests
        run: npm run wasm:test

      - name: Build web app
        run: npm run build:ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Run bounded browser-control smoke tests
        if: github.event_name == 'pull_request'
        env:
          PCE500_E2E_USE_EXISTING_BUILD: '1'
        run: npm run e2e -- e2e/responsiveness.spec.ts e2e/script_isolation.spec.ts e2e/input_ownership.spec.ts e2e/frame_delivery.spec.ts e2e/pacing.spec.ts --workers=1 --grep-invert 'measure acknowledged Pause'

      - name: Run browser e2e tests
        if: github.event_name == 'push'
        env:
          PCE500_E2E_USE_EXISTING_BUILD: '1'
        run: npm run e2e
