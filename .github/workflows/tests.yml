name: Tests

on:
  push:
    branches: [ main, master, fast ]
  pull_request:
    branches: [ main, master, codex/oz9600-core ]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
      with:
        submodules: recursive
    
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.11"
    
    - name: Install uv
      uses: astral-sh/setup-uv@v4
      with:
        enable-cache: true
        cache-dependency-glob: "pyproject.toml"
    
    - name: Install dependencies
      run: |
        uv sync --extra dev --extra pce500

    - name: Build Rust LLAMA backend
      env:
        FORCE_BINJA_MOCK: 1
      run: |
        uv pip install maturin
        uv run maturin develop --manifest-path sc62015/rustcore/Cargo.toml
    
    - name: Run contract harness parity tests
      env:
        FORCE_BINJA_MOCK: 1
      run: |
        uv run pytest sc62015/pysc62015/test_contract_harness.py -v


    - name: Run SC62015 tests
      env:
        FORCE_BINJA_MOCK: 1
      run: |
        uv run pytest sc62015 tools/test_live_binja_llil_qualify.py tools/test_gui_binja_llil_qualify.py -v --cov=sc62015/pysc62015 --cov-report=term-missing
    
    - name: Run PCE500 tests
      env:
        FORCE_BINJA_MOCK: 1
      run: |
        uv run pytest pce500 -v --cov=pce500 --cov-report=term-missing
    
    - name: Run type checking
      run: |
        uv run pyright sc62015/pysc62015
